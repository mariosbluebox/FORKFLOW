name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type check, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          NEXTAUTH_SECRET: ci-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_BASIC_PRICE_ID: price_placeholder
          STRIPE_PRO_PRICE_ID: price_placeholder
          POSTMARK_INBOUND_WEBHOOK_TOKEN: placeholder
          POSTMARK_SERVER_TOKEN: placeholder
          CRON_SECRET: placeholder
          SUPER_ADMIN_EMAIL: admin@placeholder.com

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docker invocation rather than gitleaks-action@v2 because the action
      # calls the GitHub API to list PR commits, which fails with a 403 on
      # Dependabot PRs and fork PRs (their GITHUB_TOKEN is read-only).
      # The docker form does a pure filesystem/history scan — no API access
      # needed. Exit 1 on findings is what fails the job.
      - name: Run Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest detect --source=/repo --redact --no-banner

  audit:
    name: npm audit (high+ vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev
