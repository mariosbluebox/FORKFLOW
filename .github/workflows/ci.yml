name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege: no job needs to write to the repo.
permissions:
  contents: read

jobs:
  ci:
    name: Type check, Lint & Build
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXTAUTH_SECRET: ci-secret-placeholder
          NEXTAUTH_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_placeholder
          STRIPE_WEBHOOK_SECRET: whsec_placeholder
          STRIPE_BASIC_PRICE_ID: price_placeholder
          STRIPE_PRO_PRICE_ID: price_placeholder
          POSTMARK_INBOUND_WEBHOOK_TOKEN: placeholder
          POSTMARK_SERVER_TOKEN: placeholder
          CRON_SECRET: placeholder
          SUPER_ADMIN_EMAIL: admin@placeholder.com

  gitleaks:
    name: Gitleaks (secret scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Docker form instead of gitleaks-action@v2: the action calls the GitHub
      # API to list PR commits, which 403s on Dependabot/fork PRs (read-only token).
      - name: Run Gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 detect --source=/repo --redact --no-banner

  audit:
    name: npm audit (high+ vulnerabilities)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --audit-level=high --omit=dev

  e2e:
    name: Playwright E2E (Chromium)
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      NEXTAUTH_SECRET: ci-secret-placeholder
      NEXTAUTH_URL: http://localhost:3000
      STRIPE_SECRET_KEY: sk_test_placeholder
      STRIPE_WEBHOOK_SECRET: whsec_placeholder
      STRIPE_BASIC_PRICE_ID: price_placeholder
      STRIPE_PRO_PRICE_ID: price_placeholder
      POSTMARK_INBOUND_WEBHOOK_TOKEN: placeholder
      POSTMARK_SERVER_TOKEN: placeholder
      CRON_SECRET: placeholder
      SUPER_ADMIN_EMAIL: admin@placeholder.com

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browser (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
